<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">How AgentOmniE2E works</text>

  <!-- Lane 1: authoring -->
  <rect x="10" y="56" width="940" height="160" rx="12" fill="#eef4ff" stroke="#c7d7f5"/>
  <text x="26" y="82" font-size="14" font-weight="700" fill="#1e3a8a">1 · WRITING TESTS: Claude Code agents (design time)</text>

  <g font-size="13" text-anchor="middle">
    <rect x="20"  y="100" width="118" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="79"  y="126" font-weight="700" fill="#0f172a">explorer</text>
    <text x="79"  y="146" font-size="11" fill="#475569">crawls the app,</text>
    <text x="79"  y="159" font-size="11" fill="#475569">lists test cases</text>

    <rect x="153" y="100" width="118" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="212" y="126" font-weight="700" fill="#0f172a">test-data</text>
    <text x="212" y="146" font-size="11" fill="#475569">writes fixtures</text>
    <text x="212" y="159" font-size="11" fill="#475569">+ data helpers</text>

    <rect x="286" y="100" width="118" height="64" rx="8" fill="#fff7e6" stroke="#f59e0b"/>
    <text x="345" y="126" font-weight="700" fill="#0f172a">You approve</text>
    <text x="345" y="146" font-size="11" fill="#475569">the test-case</text>
    <text x="345" y="159" font-size="11" fill="#475569">catalog</text>

    <rect x="419" y="100" width="118" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="478" y="126" font-weight="700" fill="#0f172a">planner</text>
    <text x="478" y="146" font-size="11" fill="#475569">case → step-by-</text>
    <text x="478" y="159" font-size="11" fill="#475569">step plan</text>

    <rect x="552" y="100" width="118" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="611" y="126" font-weight="700" fill="#0f172a">generator</text>
    <text x="611" y="146" font-size="11" fill="#475569">writes page objects</text>
    <text x="611" y="159" font-size="11" fill="#475569">+ spec, runs it</text>

    <rect x="685" y="100" width="118" height="64" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="744" y="126" font-weight="700" fill="#0f172a">healer</text>
    <text x="744" y="146" font-size="11" fill="#475569">fixes failures</text>
    <text x="744" y="159" font-size="11" fill="#475569">(max 3 tries)</text>

    <rect x="818" y="100" width="118" height="64" rx="8" fill="#fff7e6" stroke="#f59e0b"/>
    <text x="877" y="126" font-weight="700" fill="#0f172a">You review</text>
    <text x="877" y="146" font-size="11" fill="#475569">every change</text>
    <text x="877" y="159" font-size="11" fill="#475569">in a pull request</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="138" y1="132" x2="151" y2="132"/>
    <line x1="271" y1="132" x2="284" y2="132"/>
    <line x1="404" y1="132" x2="417" y2="132"/>
    <line x1="537" y1="132" x2="550" y2="132"/>
    <line x1="670" y1="132" x2="683" y2="132"/>
    <line x1="803" y1="132" x2="816" y2="132"/>
  </g>
  <text x="480" y="200" text-anchor="middle" font-size="12" fill="#475569">Agents drive a real browser through @wdio/mcp or @playwright/mcp (per TEST_ENGINE). Rules in CLAUDE.md: never weaken an assertion.</text>

  <!-- arrow lane1 -> repo -->
  <line x1="480" y1="216" x2="480" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="490" y="238" font-size="12" fill="#475569">writes</text>

  <!-- Repo band -->
  <rect x="10" y="254" width="940" height="92" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="26" y="278" font-size="14" font-weight="700" fill="#334155">FILES IN THE REPO</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="26"  y="292" width="210" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="131" y="317">test-cases/catalog.md · plans/</text>
    <rect x="256" y="292" width="210" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="361" y="309">test/wdio/ or test/playwright/</text>
    <text x="361" y="325" font-size="11" fill="#475569">where fields &amp; buttons are</text>
    <rect x="486" y="292" width="210" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="591" y="309">*.e2e.ts or *.spec.ts</text>
    <text x="591" y="325" font-size="11" fill="#475569">the checks themselves</text>
    <rect x="716" y="292" width="218" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="825" y="309">test/fixtures/ · .env</text>
    <text x="825" y="325" font-size="11" fill="#475569">test data · URL &amp; login</text>
  </g>

  <!-- arrow repo -> lane2 -->
  <line x1="480" y1="346" x2="480" y2="380" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="490" y="368" font-size="12" fill="#475569">reads</text>

  <!-- Lane 2: running -->
  <rect x="10" y="384" width="940" height="200" rx="12" fill="#ecfdf3" stroke="#bbe5cb"/>
  <text x="26" y="410" font-size="14" font-weight="700" fill="#166534">2 · RUNNING TESTS: WebdriverIO or Playwright (TEST_ENGINE), no AI (locally, Docker or GitHub)</text>

  <g font-size="13" text-anchor="middle">
    <rect x="24"  y="430" width="160" height="84" rx="8" fill="#ffffff" stroke="#22c55e"/>
    <text x="104" y="458" font-weight="700" fill="#0f172a">npm run test:smoke</text>
    <text x="104" y="478" font-size="11" fill="#475569">or test / test:ci /</text>
    <text x="104" y="492" font-size="11" fill="#475569">test:regression</text>

    <rect x="212" y="430" width="160" height="84" rx="8" fill="#ffffff" stroke="#22c55e"/>
    <text x="292" y="458" font-weight="700" fill="#0f172a">Test runner</text>
    <text x="292" y="478" font-size="11" fill="#475569">WebdriverIO or Playwright,</text>
    <text x="292" y="492" font-size="11" fill="#475569">picked by TEST_ENGINE;</text>
    <text x="292" y="506" font-size="11" fill="#475569">filters by @smoke tag</text>

    <rect x="400" y="430" width="160" height="84" rx="8" fill="#ffffff" stroke="#22c55e"/>
    <text x="480" y="458" font-weight="700" fill="#0f172a">Chrome</text>
    <text x="480" y="478" font-size="11" fill="#475569">types, clicks, waits</text>
    <text x="480" y="492" font-size="11" fill="#475569">like a real user</text>

    <rect x="588" y="430" width="160" height="84" rx="8" fill="#ffffff" stroke="#22c55e"/>
    <text x="668" y="458" font-weight="700" fill="#0f172a">Your app</text>
    <text x="668" y="478" font-size="11" fill="#475569">BASE_URL from .env</text>
    <text x="668" y="492" font-size="11" fill="#475569">(staging, never prod)</text>

    <rect x="776" y="430" width="160" height="84" rx="8" fill="#ffffff" stroke="#22c55e"/>
    <text x="856" y="458" font-weight="700" fill="#0f172a">Results</text>
    <text x="856" y="478" font-size="11" fill="#475569">pass/fail in terminal</text>
    <text x="856" y="492" font-size="11" fill="#475569">Allure or HTML report</text>
    <text x="856" y="506" font-size="11" fill="#475569">screenshot on failure</text>
  </g>
  <g stroke="#475569" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="184" y1="472" x2="210" y2="472"/>
    <line x1="372" y1="472" x2="398" y2="472"/>
    <line x1="560" y1="472" x2="586" y2="472"/>
    <line x1="748" y1="472" x2="774" y2="472"/>
  </g>
  <text x="480" y="560" text-anchor="middle" font-size="12" fill="#475569">Each test checks the app with expect(...); e.g. "after login, the URL is the admin area".</text>
</svg>
